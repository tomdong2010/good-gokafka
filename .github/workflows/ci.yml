name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Kafka
        run: docker compose up -d --wait kafka
      - run: go test -tags integration -race -count=1 -v ./integration/...
      - name: Kafka logs
        if: failure()
        run: docker compose logs kafka

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose --profile monitoring --profile ui config -q
      - name: Validate Prometheus config
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/cfg:ro" prom/prometheus:v3.5.0 check config /cfg/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool deploy/grafana/dashboards/good-gokafka.json > /dev/null

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [producer, consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
