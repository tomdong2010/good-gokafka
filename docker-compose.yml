# Full demo: docker compose up --build
# Scale consumers to watch partitions rebalance: docker compose up --scale consumer=3
# Add a web UI on http://localhost:8080: docker compose --profile ui up
# Add Prometheus (:9090) and a Grafana dashboard (:3001): docker compose --profile monitoring up
services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092" # for clients on the host (go run, tests)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3 # auto-created topics get 3 partitions, enough for 3 consumers
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  producer:
    build:
      context: .
      args: { APP: producer }
    ports:
      - "3000:3000"
    environment: &common
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: messages
      MESSAGE_FORMAT: proto
      LOG_FORMAT: json
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  consumer:
    build:
      context: .
      args: { APP: consumer }
    environment:
      <<: *common
      KAFKA_GROUP_ID: demo-consumers
      METRICS_ADDR: ":9100"
      # Demo knob: fail this fraction of records to exercise retries and the DLQ, e.g. 0.3
      SIMULATE_FAILURE_RATE: ${SIMULATE_FAILURE_RATE:-0}
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: [ui]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports:
      - "3001:3000"
    environment:
      # Local demo only: open the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/good-gokafka.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
